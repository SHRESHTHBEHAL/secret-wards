# Privacy rules for raksha. Simple "key: value" lines; anything after # is a comment.
# Numbers measured with scripts/attack.py on the practice data (48 patients, 773 records).
dob_mode: remove           # remove / year / shift. A date of birth is never released: "[DOB]" (FHIR birthDate is dropped).
                           # Shifting by < 1 year kept the birth year, which made patients unique (resistance 0.61 -> 0.72 when removed).
age_band_years: 10         # ages become 10-year bands like 40-49, the same band for every record of one patient
                           # (5-year bands let pooled records narrow the age; 10-year bands: resistance 0.72 -> 0.77).
age_top: 85                # ages at or above this collapse into one top band "85+"
geo_min_cell: 3            # a patient keeps district and 3-digit PIN prefix only when at least this many patients in the
                           # release share their (district, gender, age band); otherwise "[DISTRICT]" and "[PIN]".
                           # 3 gives resistance 0.87 (2 gives 0.86, 5 or "always" gives 0.87 too); 0 switches it off.
date_shift_max_days: 180   # every date of one patient moves by the same keyed offset, at most this many days
date_shift_min_days: 30    # ... and at least this many days (never 0)
rare_rule: off             # measured and rejected: generalising rare diagnoses gained ~0.01 resistance but changed 23% of diagnoses
rare_k: 3                  # (only used if rare_rule is on) a combination seen fewer than k times counts as rare
rare_cap_pct: 8            # (only used if rare_rule is on) never generalise more than this percentage of records
